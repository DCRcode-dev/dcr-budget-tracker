name: Automated Bank Feed Sync

on:
  schedule:
    - cron: "0 * * * *"  # Runs automatically every hour
  workflow_dispatch:      # Manual run button

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Live Bank Data
        env:
          SIMPLEFIN_ACCESS_URL: ${{ secrets.SIMPLEFIN_ACCESS_URL }}
        run: |
          if [ -n "$SIMPLEFIN_ACCESS_URL" ]; then
            python3 sync_cloud.py "$SIMPLEFIN_ACCESS_URL"
          else
            echo "SIMPLEFIN_ACCESS_URL not yet set in repo secrets."
          fi

      - name: Commit and Push Live Ledger Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes in data.json."
          else
            git commit -m "chore: automated live bank feed sync [skip ci]"
            git push
          fi
